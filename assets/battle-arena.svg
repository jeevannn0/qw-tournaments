<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" role="img" aria-labelledby="title description">
  <title id="title">Original QW battle arena poster</title>
  <desc id="description">Four stylized competitors stand in a dark battle arena against an orange final-zone glow and tactical interface markings.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#111923"/>
      <stop offset="0.55" stop-color="#090d13"/>
      <stop offset="1" stop-color="#030507"/>
    </linearGradient>
    <radialGradient id="zone" cx="50%" cy="48%" r="54%">
      <stop offset="0" stop-color="#ffe178"/>
      <stop offset="0.42" stop-color="#ff9d00"/>
      <stop offset="0.78" stop-color="#e74800"/>
      <stop offset="1" stop-color="#e74800" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="armor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#343e4b"/>
      <stop offset="0.5" stop-color="#141a21"/>
      <stop offset="1" stop-color="#070a0e"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb000"/>
      <stop offset="0.2" stop-color="#272f39"/>
      <stop offset="1" stop-color="#080b10"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111820"/>
      <stop offset="1" stop-color="#020304"/>
    </linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0v64" fill="none" stroke="#ffb000" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="20" stdDeviation="18" flood-color="#000000" flood-opacity="0.72"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="2" seed="7" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="faded"><feFuncA type="table" tableValues="0 0.11"/></feComponentTransfer>
      <feBlend in="SourceGraphic" in2="faded" mode="screen"/>
    </filter>
    <clipPath id="frame"><path d="M42 0h1516l42 42v1116l-42 42H42L0 1158V42Z"/></clipPath>
  </defs>

